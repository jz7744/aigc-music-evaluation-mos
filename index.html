<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIGC Electronic Music Evaluation (MOS)</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#dcdcd4; --accent:#2f5d50; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --fg:#ecece6; --muted:#9a9a92; --card:#1f201e; --line:#363733; --accent:#7fb8a4; --accent-fg:#10201a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 24px; }
  h1 { font-size:1.5rem; margin:0 0 12px; }
  p { margin:0 0 14px; }
  .muted { color:var(--muted); font-size:.92rem; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:12px 20px; }
  button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .center { text-align:center; }
  .progress { height:6px; background:var(--line); border-radius:3px; margin-bottom:24px; overflow:hidden; }
  .progress > div { height:100%; background:var(--accent); width:0; transition:width .2s; }
  .scale { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:20px 0 4px; }
  .scale button { padding:14px 4px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .scale button b { font-size:1.4rem; }
  .scale button span { font-size:.78rem; color:var(--muted); }
  .scale button.sel { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .scale button.sel span { color:var(--accent-fg); }
  .status { min-height:1.6em; color:var(--muted); font-size:.95rem; margin:10px 0; }
  ul { padding-left:20px; margin:0 0 14px; }
  textarea { width:100%; font:inherit; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; }
</style>
</head>
<body>
<main><div class="card" id="screen" aria-live="polite"></div></main>

<script>
/* ===================== CONFIG: edit this block ===================== */
const AUDIO_DIR = 'audio/';
const EXT = '.wav';
const GENERATORS = ['suno', 'mureka', 'acestep'];
const PROMPTS = ['EA', 'EB', 'EC', 'ED'];
const RENDERS = [1, 2];
const PRACTICE = [];   // no practice block (put clip ids here, e.g. ['practice_low'], to add one)
const ATTENTION = [];   // no attention checks (add clip ids here, e.g. ['attn_1','attn_2'], to use them)
const BLOCK_BY_PROMPT = true;   // true: clips from the same prompt (different generators) are rated together, one set per prompt
const DIMS = {
  quality: {
    name: 'Audio quality',
    question: 'How good is the audio quality?',
    definition: 'How clean and well-produced the <b>sound</b> is: clarity, a balanced mix, natural-sounding instruments and synths, ' +
                'and the absence of noise, distortion, glitches or artificial &ldquo;digital&rdquo; artifacts. ' +
                'Judge the sound only, not whether you like the style or the composition.'
  },
  musicality: {
    name: 'Musicality',
    question: 'How good is the musicality?',
    definition: 'How good the <b>music itself</b> is: groove and rhythm, melody and harmony, interesting development ' +
                '(build-ups, variation), and whether it feels like a coherent, intentional piece a producer might make. ' +
                'Judge the music, not the recording quality.'
  }
};
const LABELS = ['Bad', 'Poor', 'Fair', 'Good', 'Excellent'];
const ENDPOINT = '';      // REQUIRED: paste your Google Apps Script web-app URL here, or nothing is saved
if (!ENDPOINT) console.warn('ENDPOINT is empty: responses are NOT being saved anywhere.');
const STUDY_NAME = 'rating-study';
/* =================================================================== */

const STUDY = [];
for (const g of GENERATORS) for (const p of PROMPTS) for (const r of RENDERS) STUDY.push(`${g}_${p}_${r}`);

const $ = document.getElementById('screen');
const params = new URLSearchParams(location.search);
const pid = (params.get('pid') || '').replace(/[^\w-]/g, '') ||
            'P' + Math.random().toString(36).slice(2, 8).toUpperCase();
const rows = [];                         // every trial, in memory
const FIELDS = ['participant_id', 'block_order', 'trial_kind', 'presentation_index', 'prompt', 'set_index', 'clip_id', 'rating_quality', 'rating_musicality', 'dim_order', 'rt',
                'timestamp', 'user_agent'];
let sendFailures = 0;
const DIM_ORDER = shuffle(['quality', 'musicality']);   // question order is randomized once per participant

function shuffle(a) {                    // Fisher-Yates with crypto randomness
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(html) { $.innerHTML = html; window.scrollTo(0, 0); }
function wait(id) { return new Promise(res => document.getElementById(id).addEventListener('click', res, { once: true })); }

function record(row) {
  row = { participant_id: pid, block_order: 'mos', user_agent: navigator.userAgent,
          timestamp: new Date().toISOString(), ...row };
  rows.push(row);
  try { localStorage.setItem(STUDY_NAME + '_' + pid, JSON.stringify(rows)); } catch (e) {}
  if (ENDPOINT) {
    fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', keepalive: true,
                      headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(row) })
      .catch(() => { sendFailures++; });
  }
}
function csv() {  // kept for debugging: type csv() in the browser console
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [FIELDS.join(',')].concat(rows.map(r => FIELDS.map(f => q(r[f])).join(','))).join('\n');
}

/* One trial: play once (cannot pause or replay), then rate BOTH dimensions (buttons or keys 1-5), then Next. */
function playTrial({ title, clip, progress }) {
  return new Promise(resolve => {
    const audio = new Audio(AUDIO_DIR + clip + EXT);
    audio.preload = 'auto';
    let t0 = null, played = false, done = false;
    const ans = {};
    const block = d => `
      <div class="dim" data-dim="${d}">
        <p style="margin:18px 0 4px"><b>${DIMS[d].question}</b></p>
        <p class="muted" style="margin:0 0 6px">${DIMS[d].definition}</p>
        <div class="scale">${LABELS.map((l, k) => `<button data-v="${k + 1}" disabled><b>${k + 1}</b><span>${l}</span></button>`).join('')}</div>
      </div>`;
    show(`
      <div class="progress"><div style="width:${Math.round(progress * 100)}%"></div></div>
      <h1>${title}</h1>
      <div class="center"><button class="primary" id="play">&#9654;&nbsp; Play clip</button></div>
      <div class="status" id="status">Press play. The clip plays once, in full.</div>
      ${DIM_ORDER.map(block).join('')}
      <div class="center" style="margin-top:18px"><button class="primary" id="next" disabled>Next</button></div>
      <p class="muted center">After the clip ends you can also answer with the keys 1&ndash;5 (first question, then second).</p>
    `);
    const status = document.getElementById('status');
    const play = document.getElementById('play');
    const next = document.getElementById('next');
    const groups = Object.fromEntries([...document.querySelectorAll('.dim')].map(g => [g.dataset.dim, g]));

    const mark = d => {
      [...groups[d].querySelectorAll('button')].forEach(b => b.classList.toggle('sel', +b.dataset.v === ans[d]));
      next.disabled = !(played && DIM_ORDER.every(k => ans[k]));
    };
    const set = (d, v) => { if (!played) return; ans[d] = v; mark(d); };
    const onKey = e => {
      if (!played || !/^[1-5]$/.test(e.key)) return;
      const d = DIM_ORDER.find(k => !ans[k]);
      if (d) set(d, +e.key);
    };
    document.addEventListener('keydown', onKey);
    DIM_ORDER.forEach(d => groups[d].querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => set(d, +b.dataset.v))));

    next.addEventListener('click', () => {
      if (done || next.disabled) return; done = true;
      document.removeEventListener('keydown', onKey);
      resolve({ quality: ans.quality, musicality: ans.musicality, rt: +((performance.now() - t0) / 1000).toFixed(2) });
    });
    const enable = () => {
      t0 = performance.now(); played = true;
      status.textContent = 'Now rate the clip on both questions.';
      document.querySelectorAll('.scale button').forEach(b => b.disabled = false);
    };
    play.addEventListener('click', () => {
      play.disabled = true; status.textContent = 'Playing\u2026';
      audio.play().catch(() => {
        status.textContent = 'Could not play the audio. Check your volume and connection, then reload this page.';
      });
    }, { once: true });
    audio.addEventListener('ended', enable, { once: true });
    audio.addEventListener('error', () => {
      status.textContent = 'This clip failed to load. Please check your connection and reload the page.';
    });
  });
}

async function main() {
  show(`
    <h1>AIGC Electronic Music Evaluation (MOS)</h1>
    <p>You will hear short music clips, one at a time, and rate each one on <b>two questions</b>.
       It takes about 20 minutes.</p>
    <ul>
      <li>Use <b>headphones</b> in a quiet place, and set a comfortable volume before you start. Please do not change it during the study.</li>
      <li>Each clip is about 20 seconds and plays <b>once</b>. Listen to the whole clip, then rate it.</li>
      <li><b>Audio quality</b>: ${DIMS.quality.definition}</li>
      <li><b>Musicality</b>: ${DIMS.musicality.definition}</li>
      <li>Rate each from 1 (Bad) to 5 (Excellent). There are no right answers; we want your own impression. Please use the whole scale.</li>
    </ul>
    <p class="muted">[IRB CONSENT TEXT HERE: purpose, voluntary participation, what data is collected, how it is stored,
       contact information. Replace with your approved wording.]</p>
    <div class="center"><button class="primary" id="go">I consent &mdash; start</button></div>
    <p class="muted center">Your participant code: <b>${pid}</b></p>`);
  await wait('go');

  if (PRACTICE.length) {
    show(`<h1>Practice</h1><p>First, ${PRACTICE.length} practice clips. They are not rated; they show the range of quality you will hear.</p>
          <p>Set a comfortable volume now and <b>do not change it</b> during the study.</p>
          <div class="center"><button class="primary" id="go">Start practice</button></div>`);
    await wait('go');
    for (let i = 0; i < PRACTICE.length; i++) {
      await playTrial({ title: `Practice ${i + 1} of ${PRACTICE.length}`, clip: PRACTICE[i], progress: 0 });
      record({ trial_kind: 'practice', presentation_index: i + 1, clip_id: PRACTICE[i], dim_order: DIM_ORDER.join('>') });
    }
  }

  show(`<h1>Now the rating begins</h1><p>Rate every clip on audio quality and on musicality, from 1 (Bad) to 5 (Excellent). Use the whole scale.</p>
        <div class="center"><button class="primary" id="go">Begin</button></div>`);
  await wait('go');

  // Build the order. With BLOCK_BY_PROMPT: sets of 6 clips sharing one prompt (3 generators x 2 renders),
  // set order random, clip order inside each set random. Attention checks (if any) are placed at random.
  let seq = [];
  if (BLOCK_BY_PROMPT) {
    shuffle(PROMPTS).forEach((p, si) => {
      const ids = shuffle(STUDY.filter(c => c.split('_')[1] === p));
      ids.forEach(c => seq.push({ clip: c, kind: 'study', prompt: p, set: si + 1 }));
    });
  } else {
    shuffle(STUDY).forEach(c => seq.push({ clip: c, kind: 'study', prompt: c.split('_')[1], set: '' }));
  }
  ATTENTION.forEach(c => seq.splice(Math.floor(Math.random() * (seq.length + 1)), 0,
                                    { clip: c, kind: 'attention_check', prompt: '', set: '' }));
  let lastSet = null;
  for (let i = 0; i < seq.length; i++) {
    const t = seq[i];
    if (BLOCK_BY_PROMPT && t.kind === 'study' && t.set !== lastSet) {
      lastSet = t.set;
      show(`<h1>Set ${t.set} of ${PROMPTS.length}</h1>
            <p>The next ${GENERATORS.length * RENDERS.length} clips are a new set. Rate each clip on its own.</p>
            <div class="center"><button class="primary" id="go">Continue</button></div>`);
      await wait('go');
    }
    const r = await playTrial({ title: `Clip ${i + 1} of ${seq.length}`, clip: t.clip, progress: i / seq.length });
    record({ trial_kind: t.kind, presentation_index: i + 1, prompt: t.prompt, set_index: t.set, clip_id: t.clip,
             rating_quality: r.quality, rating_musicality: r.musicality,
             dim_order: DIM_ORDER.join('>'), rt: r.rt });
  }

  show(`<h1>Thank you!</h1>
        <p>Your responses have been recorded. You can now close this page.</p>
        <p class="muted">Your participant code: <b>${pid}</b></p>`);
}
main();
window.__rows = rows;   // for testing
</script>
</body>
</html>
